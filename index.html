<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chicago 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: block;
    }

    /* Loading screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0f1a;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.6s ease;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #loading-title {
      color: #c8d8f0;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #loading-text {
      color: #7090b0;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }

    #loading-bar-outer {
      width: 320px;
      height: 3px;
      background: #1a2535;
      border-radius: 2px;
      overflow: hidden;
    }

    #loading-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4a8fff, #8ac0ff);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    #loading-error {
      color: #ff6060;
      font-size: 0.85rem;
      display: none;
      max-width: 400px;
      text-align: center;
    }

    /* Crosshair */
    #crosshair {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
      pointer-events: none;
      z-index: 100;
      display: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
    }

    #crosshair::before {
      width: 2px; height: 100%;
      left: 50%; top: 0;
      transform: translateX(-50%);
    }

    #crosshair::after {
      width: 100%; height: 2px;
      top: 50%; left: 0;
      transform: translateY(-50%);
    }

    /* Pointer lock overlay */
    #pointer-lock-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      background: rgba(0, 0, 0, 0.45);
      display: none;
    }

    #pointer-lock-overlay .prompt {
      color: #e0eaf8;
      font-size: 1.1rem;
      letter-spacing: 0.06em;
      background: rgba(10, 15, 26, 0.8);
      padding: 18px 36px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Controls hint */
    #controls-hint {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: rgba(255,255,255,0.5);
      font-size: 0.78rem;
      line-height: 1.7;
      z-index: 100;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="loading-screen">
    <div id="loading-title">Chicago</div>
    <div id="loading-text">Initializing...</div>
    <div id="loading-bar-outer">
      <div id="loading-bar-inner"></div>
    </div>
    <div id="loading-error"></div>
  </div>

  <div id="crosshair"></div>

  <div id="pointer-lock-overlay">
    <div class="prompt">Click to explore Chicago</div>
  </div>

  <div id="controls-hint">
    WASD — Move &nbsp;|&nbsp; Mouse — Look &nbsp;|&nbsp; ESC — Release cursor
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
